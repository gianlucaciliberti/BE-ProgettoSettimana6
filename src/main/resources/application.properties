spring.application.name=chatapp

# Config locale opzionale (credenziali reali, mai committata: vedi application-local.properties.example)
spring.config.import=optional:classpath:application-local.properties

# --- Database ---
spring.datasource.url=jdbc:postgresql://localhost:5432/chatapp
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Mail (Gmail SMTP con App Password) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- OpenRouter AI ---
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.model=nvidia/nemotron-3.5-lightning:free

server.port=8080
