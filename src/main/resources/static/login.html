<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Accedi - ChatApp</title>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body class="auth-body">
<div class="auth-card">
    <h1 class="auth-title">ChatApp</h1>
    <h2 class="auth-subtitle">Accedi</h2>

    <p id="auth-message" class="auth-message" hidden></p>

    <form id="login-form" class="auth-form" method="post" action="/login">
        <input type="text" name="username" placeholder="Nome utente" required autocomplete="username"/>
        <input type="password" name="password" placeholder="Password" required autocomplete="current-password"/>
        <button type="submit" class="btn-primary">Accedi</button>
    </form>

    <p class="auth-switch">Non hai un account? <a href="/register.html">Registrati</a></p>
</div>

<script>
    const params = new URLSearchParams(location.search);
    const messageEl = document.getElementById('auth-message');
    if (params.has('error')) {
        messageEl.textContent = 'Nome utente o password non corretti.';
        messageEl.hidden = false;
    } else if (params.has('logout')) {
        messageEl.textContent = 'Logout effettuato con successo.';
        messageEl.hidden = false;
    } else if (params.has('registered')) {
        messageEl.textContent = 'Account creato! Ora puoi accedere.';
        messageEl.hidden = false;
    }
</script>
</body>
</html>
