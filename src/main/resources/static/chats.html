<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>ChatApp</title>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="app">
    <header class="app-header">
        <span class="app-title">ChatApp</span>
        <span id="current-user-name" class="current-user"></span>
        <div class="header-actions">
            <button id="stats-btn" class="btn-secondary">Statistiche</button>
            <button id="logout-btn" class="btn-secondary">Esci</button>
        </div>
    </header>

    <div class="app-body">
        <aside class="sidebar">
            <button id="new-chat-btn" class="btn-primary full-width">+ Nuova chat</button>
            <div id="chat-list" class="chat-list"></div>
        </aside>

        <main class="chat-panel">
            <div id="empty-state" class="empty-state">Seleziona una chat per iniziare</div>

            <div id="chat-view" class="chat-view" hidden>
                <div class="chat-view-header">
                    <span id="chat-with-name"></span>
                </div>
                <div id="messages" class="messages"></div>
                <div class="composer">
                    <textarea id="message-input" placeholder="Scrivi un messaggio..." rows="2"></textarea>
                    <div class="composer-actions">
                        <button id="ai-help-btn" class="btn-secondary" title="Chiedi un suggerimento all'IA">Aiuto</button>
                        <button id="send-btn" class="btn-primary">Invia</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Modale nuova chat -->
<div id="new-chat-modal" class="modal-overlay" hidden>
    <div class="modal">
        <div class="modal-header">
            <span>Scegli un contatto</span>
            <button id="close-new-chat" class="btn-icon">&times;</button>
        </div>
        <div id="user-list" class="user-list"></div>
    </div>
</div>

<!-- Modale statistiche -->
<div id="stats-modal" class="modal-overlay" hidden>
    <div class="modal stats-modal">
        <div class="modal-header">
            <span>Le tue statistiche</span>
            <button id="close-stats" class="btn-icon">&times;</button>
        </div>
        <div class="stats-body">
            <div class="stat-row stat-sent">
                <div class="stat-info"><span class="stat-label">Messaggi inviati</span><span class="stat-hint">Totale dei messaggi che hai scritto</span></div>
                <strong id="stat-sent" class="stat-value">-</strong>
            </div>
            <div class="stat-row stat-received">
                <div class="stat-info"><span class="stat-label">Messaggi ricevuti</span><span class="stat-hint">Messaggi arrivati dagli altri utenti</span></div>
                <strong id="stat-received" class="stat-value">-</strong>
            </div>
            <div class="stat-row stat-chats">
                <div class="stat-info"><span class="stat-label">Chat aperte</span><span class="stat-hint">Conversazioni a cui partecipi</span></div>
                <strong id="stat-chats" class="stat-value">-</strong>
            </div>
            <button id="email-stats-btn" class="btn-primary full-width">Invia via email</button>
            <p id="stats-message" class="auth-message" hidden></p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ws.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
